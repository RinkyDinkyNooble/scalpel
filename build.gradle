// The root build holds core/ only. Ports live in ports/<loader>-<minecraft>/ as separate builds.

subprojects {
    group = mod_group_id
    version = mod_version

    repositories {
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
    }
}
