pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'scalpel'

// Loader-independent logic, with its unit tests. Must never import Minecraft or loader classes.
include 'core'

// The ports are separate builds, one per jar, so each can use its own loader plugin:
//   ./gradlew -p ports/forge-1.20.1 build
//   ./gradlew -p ports/fabric-1.20.1 build
// build-all.sh / build-all.ps1 build core and every port and collect the jars in build/release/.
