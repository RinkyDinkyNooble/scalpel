org.gradle.jvmargs=-Xmx3G

# Shared code of this Minecraft line: common/<common_line>/
common_line=26.3
# 26.x needs Java 25 (gradle/port.gradle sets the compiler's release from this)
java_version=25

# One jar for Fabric and Quilt, Minecraft 26.3 (26.3 moved recipe loading out of RecipeManager and folded
# SimpleJsonResourceReloadListener.scanDirectory into prepare, so the 26.1 jar can't run on it).
# Minecraft is unobfuscated from 26.1: no mappings, no remapping.
minecraft_version=26.3
fabric_minecraft_range=>=26.3 <26.4
fabric_loader_version=0.20.1
# Fabric API for 26.3 needs this loader itself (checked in its fabric.mod.json).
fabric_loader_min=0.19.3
fabric_api_version=0.166.2+26.3

# Optional integrations (compile only)
jei_version=31.17.0.113
jade_version=26.3.5+fabric
