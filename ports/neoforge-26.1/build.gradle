plugins {
    id 'net.neoforged.moddev' version '2.0.148'
}

// Shared metadata, plus core's and common/26.1's sources compiled straight into this jar.
apply from: '../../gradle/port.gradle'

base {
    // One jar for the whole 26.1.x line: scalpel-neoforge-26.1-<version>.jar
    archivesName = "${mod_id}-neoforge-${jar_minecraft}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Minecraft 26.x class files are Java 25. port.gradle reads java_version too; this keeps the port building with a
// port.gradle that doesn't.
tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

neoForge {
    version = project.neo_version

    runs {
        configureEach {
            // -PrunDir=run/26.2 keeps a second game folder (other mod builds) for a client on another NeoForge line.
            gameDirectory = project.file(project.findProperty('runDir') ?: 'run')
            systemProperty 'forge.logging.console.level', 'info'
            // NeoForge 26.2+ stops a dev client on a warning screen for every test mod still using `logoFile`
            // (BOP, Macaw's, ...; never in production). -PhideLogoWarnings uses NeoForge's own switch to skip it.
            if (project.hasProperty('hideLogoWarnings')) {
                systemProperty 'neoforge.warnings.logofile.hide', 'true'
            }
        }
        client {
            client()
            // ./gradlew runClient -PquickPlay=<world> opens a world in run/saves straight away.
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay')
            }
            if (project.hasProperty('quickJoin')) {
                programArguments.addAll '--quickPlayMultiplayer', project.property('quickJoin')
            }
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven { url = 'https://maven.blamejared.com/' }         // JEI
    maven { url = 'https://api.modrinth.com/maven' }        // Jade
}

dependencies {
    // Optional integrations: compiled against their APIs, never required at runtime.
    compileOnly "mezz.jei:jei-${jei_minecraft}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${jei_minecraft}-neoforge-api:${jei_version}"
    compileOnly "maven.modrinth:jade:${jade_version}"

    // The dev client loads its mods (JEI 29.47 from Modrinth, Jade, test mods) from run/mods: BlameJared's maven stops
    // at JEI 29.2 for 26.1.
}

processResources {
    var replaceProperties = [
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
            mod_url                 : mod_url,
            mod_issues              : mod_issues,
            minecraft_range         : neoforge_minecraft_range,
            neo_version_range       : neo_version_range,
            neo_loader_range        : neo_loader_range,
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}
