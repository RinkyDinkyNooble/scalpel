org.gradle.jvmargs=-Xmx3G
# ForgeGradle 7: one source set output, so the dev runs see classes and resources as one mod.
net.minecraftforge.gradle.merge-source-sets=true

# Shared code of this Minecraft line: common/<common_line>/
common_line=1.21.1
java_version=21

# One jar for Forge 51 (Minecraft 1.21) and Forge 52 (1.21.1). Compiled against 52.
minecraft_version=1.21.1
forge_version=52.1.21
forge_minecraft_version_range=[1.21,1.21.2)
forge_version_range=[51,)
forge_loader_version_range=[51,)

# Forge 51/52 ship Mixin 0.8.7 but not MixinExtras, so it is nested in the jar.
mixinextras_version=0.4.1

# Optional integrations (compile only). EMI and Jade have no Forge builds for 1.21.1: the shared plugin classes
# compile against their NeoForge API jars and are never loaded on Forge.
jei_version=19.70.0.469
emi_version=1.1.24+1.21.1
jade_version=15.10.6+neoforge
