org.gradle.jvmargs=-Xmx3G
# ForgeGradle 7: one source set output, so the dev runs see classes and resources as one mod.
net.minecraftforge.gradle.merge-source-sets=true

# Shared code of this Minecraft line: common/<common_line>/
common_line=26.1
java_version=25

# One jar for Forge 62 (Minecraft 26.1), 63 (26.1.1), 64 (26.1.2) and 65 (26.2), all booted and tested. Compiled
# against 64; the jar is named for the line (scalpel-forge-26.1-<version>.jar). Forge has one major version per
# Minecraft version, so the Minecraft range is what limits the jar. 26.3 (Forge 66) is left out: common/26.1's data
# hook (SimpleJsonResourceReloadListener.scanDirectory) and RecipeManager.registries are gone there.
minecraft_version=26.1.2
forge_version=64.1.6
jar_minecraft=26.1
forge_minecraft_version_range=[26.1,26.3)
forge_version_range=[62,)
forge_loader_version_range=[62,)

# Forge 62-64 bundle MixinExtras (0.5.3 / 0.5.4) and add it whenever a mod has mixins, so it isn't nested here.
mixinextras_version=0.5.3

# Optional integrations (compile only). JEI, EMI and Jade have no Forge builds for 26.x: the shared plugin classes
# compile against the same API jars as the NeoForge port and are never loaded on Forge.
jei_minecraft=26.1
jei_version=29.2.0.21
jade_version=26.1.12+neoforge

# pack.mcmeta of the mod's own resources. Forge (unlike NeoForge and Fabric) reads it from the jar, and without one it
# skips the mod's data and assets ("Missing metadata in pack mod:scalpel"). Minecraft 26.1-26.1.2: resource format 84,
# data 101.1; 26.2: resource 88, data 107.1. The range covers all four (a whole number max takes every minor version).
pack_min_format=84
pack_max_format=107
