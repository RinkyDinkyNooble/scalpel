org.gradle.jvmargs=-Xmx3G
# ForgeGradle 7: one source set output, so the dev runs see classes and resources as one mod.
net.minecraftforge.gradle.merge-source-sets=true

# Shared code of this Minecraft line: common/<common_line>/
common_line=26.3
java_version=25

# One jar for Forge 66 (Minecraft 26.3), named for the line (scalpel-forge-26.3-<version>.jar). Forge has one major
# version per Minecraft version, so the Minecraft range is what limits the jar.
minecraft_version=26.3
forge_version=66.1.8
jar_minecraft=26.3
forge_minecraft_version_range=[26.3,26.3.1)
forge_version_range=[66,)
forge_loader_version_range=[66,)

# Forge 66 bundles MixinExtras 0.5.4 and adds it whenever a mod has mixins, so it isn't nested here.
mixinextras_version=0.5.4

# Optional integrations (compile only). JEI, EMI and Jade have no Forge builds for 26.x: the shared plugin classes
# compile against the same API jars as the NeoForge 26.3 port and are never loaded on Forge.
jei_minecraft=26.3
jei_version=31.17.0.113
jade_version=26.3.5+neoforge

# pack.mcmeta of the mod's own resources. Forge (unlike NeoForge and Fabric) reads it from the jar, and without one it
# skips the mod's data and assets ("Missing metadata in pack mod:scalpel"). Minecraft 26.3: resource format 97.1,
# data 121 (the 66.1.8 MDK's pack.mcmeta says 121).
pack_min_format=97
pack_max_format=121
