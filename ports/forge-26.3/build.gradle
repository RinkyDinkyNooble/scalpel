// Forge 26.3 port: ForgeGradle 7 on its own Gradle 9 wrapper (ports/forge-26.3/gradlew), since the root wrapper
// stays on Gradle 8 for ForgeGradle 6. Build: ports/forge-26.3/gradlew -p ports/forge-26.3 build
// Minecraft 26.x is not obfuscated: no mappings, no refmap, no reobf. Java 25.
plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '7.0.40'
}

// Shared metadata, plus core's and common/26.3's sources compiled straight into this jar.
apply from: '../../gradle/port.gradle'

base {
    // One jar for the 26.3 line: scalpel-forge-26.3-<version>.jar
    archivesName = "${mod_id}-forge-${jar_minecraft}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Minecraft 26.x class files are Java 25. port.gradle reads java_version too; this keeps the port building with a
// port.gradle that doesn't.
tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'forge.logging.console.level', 'info'
            // EventBus 7 checks listener wiring at runtime in dev (wrong bus, wrong event type).
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            // A dev run has no jar manifest, so Mixin is told about the configs here.
            args "--mixin.config=${mod_id}.mixins.json", "--mixin.config=${mod_id}.forge.mixins.json"
        }
        register('client') {
            // ./gradlew runClient -PquickPlay=<world> opens a world in run/saves straight away.
            if (project.hasProperty('quickPlay')) {
                args '--quickPlaySingleplayer', project.property('quickPlay')
            }
            // ./gradlew runClient -PquickJoin=localhost:26697 joins a server straight away.
            if (project.hasProperty('quickJoin')) {
                args '--quickPlayMultiplayer', project.property('quickJoin')
            }
        }
        register('server') {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    maven { url = 'https://maven.blamejared.com/' }         // JEI
    maven { url = 'https://api.modrinth.com/maven' }        // Jade
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")

    // MixinExtras: Forge 62+ ships it and adds it to any mod with mixins, so it is only compiled against.
    compileOnly "io.github.llamalad7:mixinextras-common:${mixinextras_version}"

    // Optional integrations: compiled against their APIs, never required at runtime (no Forge builds for 26.x).
    compileOnly "mezz.jei:jei-${jei_minecraft}-common-api:${jei_version}"
    compileOnly "maven.modrinth:jade:${jade_version}"

    // The dev client's other mods are release jars in run/mods/, copied from research/testenv/mods/forge-26.3/.
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version_range: forge_minecraft_version_range,
            forge_version_range    : forge_version_range,
            loader_version_range   : forge_loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_url                : mod_url,
            mod_issues             : mod_issues,
            pack_min_format        : pack_min_format,
            pack_max_format        : pack_max_format,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
    // Forge 26.x (66 too) still ships Mixin 0.8.7, whose newest compatibility level is JAVA_21; it refuses a config that names
    // a level it doesn't know ("compatibility level JAVA_25 which is not recognised"). Mixin only logs about the newer
    // class files. So the shared config (common/26.3, also read by NeoForge's and Fabric's newer Mixin) is capped here.
    filesMatching("${mod_id}.mixins.json".toString()) {
        filter { String line -> line.replaceAll(/"JAVA_2[2-9]"/, '"JAVA_21"') }
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'            : "${mod_id}.mixins.json,${mod_id}.forge.mixins.json",
        ])
    }
}
