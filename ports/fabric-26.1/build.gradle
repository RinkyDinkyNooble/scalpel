plugins {
    // Minecraft is unobfuscated from 26.1: the non-remapping Loom, plain implementation/compileOnly, no refmaps.
    id 'net.fabricmc.fabric-loom' version '1.19.4'
}

// Shared metadata, plus core's and common/26.1's sources compiled straight into this jar.
apply from: '../../gradle/port.gradle'

base {
    archivesName = "${mod_id}-fabric-26.1"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

loom {
    runs {
        configureEach {
            runDir 'run'
        }
        client {
            // ./gradlew runClient -PquickPlay=<world> opens a world in run/saves straight away.
            if (project.hasProperty('quickPlay')) {
                programArgs '--quickPlaySingleplayer', project.property('quickPlay')
            }
            if (project.hasProperty('quickJoin')) {
                programArgs '--quickPlayMultiplayer', project.property('quickJoin')
            }
        }
    }
}

repositories {
    maven { url = 'https://maven.blamejared.com/' }                 // JEI
    maven { url = 'https://api.modrinth.com/maven' }                // Jade
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Optional integrations: compiled against their APIs, never required at runtime.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    compileOnly "maven.modrinth:jade:${jade_version}"

    // Only for the dev client (cd ports/fabric-26.1 && ./gradlew runClient), never shipped. -PnoViewers leaves out JEI
    // and Jade (a dev client on another Minecraft version, e.g. -Pminecraft_version=26.2 for the range check).
    if (!project.hasProperty('noViewers')) {
        localRuntime "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
        localRuntime "maven.modrinth:jade:${jade_version}"
    }
    def testMods = rootProject.file("../../research/testenv/mods/fabric-${minecraft_version}")
    if (testMods.isDirectory()) {
        if (!project.hasProperty('noViewers')) {
            localRuntime fileTree(testMods) { include 'mezz_config-*.jar' }
        }
        if (project.hasProperty('devMods')) {
            // -PdevMods=FarmersDelight-*,TechReborn-*: extra test mods from that folder for one dev client run.
            localRuntime fileTree(testMods) { include project.property('devMods').toString().split(',').collect { it.trim() + '.jar' } }
            // Nested libraries of those jars (Tech Reborn's energy API), unpacked for the dev client.
            def nested = rootProject.file('../../research/testenv/mods/fabric-26.1.2-devnested')
            if (nested.isDirectory()) {
                localRuntime fileTree(nested) { include '*.jar' }
            }
        }
    }
}

processResources {
    var replaceProperties = [
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_license          : mod_license,
            mod_version          : mod_version,
            mod_authors          : mod_authors,
            mod_description      : mod_description,
            mod_url              : mod_url,
            mod_issues           : mod_issues,
            minecraft_range      : fabric_minecraft_range,
            fabric_loader_min    : fabric_loader_min,
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
    // No refmaps on 26.x; a shared mixin config that still names one would only log a missing-file warning.
    filesMatching('*.mixins.json') {
        filter { String line -> line.contains('"refmap"') ? null : line }
    }
}
