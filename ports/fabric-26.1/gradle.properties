org.gradle.jvmargs=-Xmx3G

# Shared code of this Minecraft line: common/<common_line>/
common_line=26.1
# 26.x needs Java 25 (gradle/port.gradle sets the compiler's release from this)
java_version=25

# One jar for Fabric and Quilt, Minecraft 26.1 to 26.2 (26.2 passed the range check; 26.3 does not: RecipeManager and
# SimpleJsonResourceReloadListener changed). Minecraft is unobfuscated from 26.1: no mappings, no remapping.
minecraft_version=26.1.2
fabric_minecraft_range=>=26.1 <26.3
fabric_loader_version=0.20.1
# Fabric API for 26.1 needs loader 0.18.4 itself.
fabric_loader_min=0.18.4
fabric_api_version=0.155.3+26.1.2

# Optional integrations (compile only)
jei_version=29.53.0.115
jade_version=26.1.11+fabric
