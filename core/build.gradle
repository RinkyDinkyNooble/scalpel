plugins {
    id 'java-library'
}

base {
    archivesName = "${mod_id}-core"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

dependencies {
    // Gson ships with every Minecraft version we target, so core only compiles against it.
    compileOnly "com.google.code.gson:gson:${gson_version}"

    testImplementation "com.google.code.gson:gson:${gson_version}"
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}
