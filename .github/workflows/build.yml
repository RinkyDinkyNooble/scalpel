name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: scalpel-${{ github.sha }}
          path: |
            forge-1.20.1/build/libs/*.jar
            !forge-1.20.1/build/libs/*-slim.jar
          if-no-files-found: error
